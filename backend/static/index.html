<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学校 AI 服务平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f5f7fa;
  --sidebar-bg: #ffffff;
  --sidebar-text: #334155;
  --sidebar-text-active: #4f46e5;
  --sidebar-hover: #f1f5f9;
  --sidebar-active: #eef2ff;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --border-subtle: #f1f5f9;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --primary: #4f46e5;
  --primary-light: #e0e7ff;
  --primary-dark: #4338ca;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow: 0 1px 3px rgba(15,23,42,0.05), 0 4px 12px rgba(15,23,42,0.04);
  --shadow-lg: 0 10px 30px -10px rgba(15,23,42,0.12);
  --top-nav-height: 56px;
  --sidebar-width: 240px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; }
a { text-decoration: none; color: inherit; }
.hidden { display: none !important; }

/* 顶部导航栏 - 保持 zhiyu-brand 样式不变 */
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  height: var(--top-nav-height);
  background: #fff;
  border-bottom: 1px solid #f1f5f9;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.top-nav-left { display: flex; align-items: center; gap: 32px; }
.top-nav-brand { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.top-nav-brand .brand-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.top-nav-brand .brand-icon svg { width: 16px; height: 16px; }
.top-nav-brand .brand-title { font-size: 16px; font-weight: 600; color: #1f2937; }
.top-nav-menu { display: flex; align-items: center; gap: 4px; }
.top-nav-item {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  color: #64748b;
  cursor: pointer;
  transition: all .15s ease;
}
.top-nav-item:hover { background: #f8fafc; color: #374151; }
.top-nav-item.active { font-weight: 500; color: var(--primary); }
.top-nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 16px; right: 16px;
  height: 2px; border-radius: 9999px;
  background: var(--primary);
}
.top-nav-right { display: flex; align-items: center; gap: 16px; }
.top-nav-time { font-size: 13px; color: var(--text-muted); display: none; }
@media (min-width: 1024px) { .top-nav-time { display: block; } }
.user-menu { position: relative; }
.user-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  cursor: pointer;
  transition: all .15s;
}
.user-trigger:hover { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.user-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.user-name { font-size: 13px; font-weight: 600; color: var(--text); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-trigger svg { width: 14px; height: 14px; color: var(--text-muted); transition: transform .2s; }
.user-trigger.open svg { transform: rotate(180deg); }
.user-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 210px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(15,23,42,0.12);
  z-index: 50;
  overflow: hidden;
}
.user-dropdown-info { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); }
.user-dropdown-name { font-weight: 700; font-size: 14px; color: var(--text); word-break: break-all; }
.user-dropdown-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.user-dropdown-logout {
  width: 100%;
  padding: 11px 16px;
  border: none;
  background: #fff;
  color: var(--danger);
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background .15s;
}
.user-dropdown-logout:hover { background: #fef2f2; }

/* 侧边栏创建按钮与菜单 */
.sidebar-header .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; cursor: pointer; }
.sidebar-header .logo svg { width: 26px; height: 26px; color: var(--primary); }
.create-btn {
  width: 100%;
  margin-top: 14px;
  padding: 10px 16px;
  border-radius: 999px;
  border: none;
  background: var(--primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 14px rgba(79,70,229,0.25);
  transition: all .15s ease;
}
.create-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,0.3); }
.create-btn svg { width: 16px; height: 16px; }
.create-menu {
  display: none;
  padding: 8px 20px 12px;
  background: #fafafa;
  border-bottom: 1px solid var(--border-subtle);
}
.create-menu.show { display: block; }
.create-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: background .15s;
}
.create-menu-item:hover { background: var(--sidebar-hover); }
.create-menu-item svg { width: 16px; height: 16px; }

/* 布局 */
.layout { display: flex; min-height: 100vh; padding-top: var(--top-nav-height); }
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border-subtle); }
.sidebar-logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; cursor: pointer; }
.sidebar-logo svg { width: 26px; height: 26px; color: var(--primary); }
.yka-sidebar-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--primary-light);
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--primary);
  background: #fff;
  transition: all .15s;
}
.yka-sidebar-btn:hover { background: var(--primary-light); border-color: var(--primary); }
.yka-sidebar-btn:active { transform: scale(0.98); }
.yka-sidebar-btn svg { width: 17px; height: 17px; }
.sidebar-create { padding: 16px 20px; }
.sidebar-create .btn {
  width: 100%;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 14px rgba(79,70,229,0.25);
}
.sidebar-create .btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,0.3); }
.sidebar-create .btn svg { width: 16px; height: 16px; }
.nav { flex: 1; padding: 4px 12px; overflow-y: auto; }
.nav-group { padding: 18px 14px 8px; font-size: 12px; color: var(--text-muted); font-weight: 500; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: all .15s ease;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 2px;
}
.nav-item svg { width: 18px; height: 18px; color: #0f172a; flex-shrink: 0; }
.nav-item:hover { background: var(--sidebar-hover); }
.nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
.nav-item.active svg { color: var(--sidebar-text-active); }
.userbar { padding: 16px 20px; border-top: 1px solid var(--border-subtle); background: #fafafa; }
.userbar .muted { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
.userbar strong { color: var(--text); font-weight: 700; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.header { height: auto; padding: 16px 28px 0; background: transparent; border-bottom: none; }
.header-back { cursor: pointer; color: var(--primary); margin-right: 12px; font-weight: 600; }
.content { flex: 1; overflow: auto; padding: 0 28px 28px; }

/* Hero */
.hero {
  position: relative;
  border-radius: var(--radius-xl);
  overflow: hidden;
  padding: 42px 40px;
  margin-bottom: 24px;
  background: linear-gradient(105deg, rgba(248,250,252,0.95) 0%, rgba(224,231,255,0.85) 55%, rgba(255,255,255,0.3) 100%),
              url('/static/hero-placeholder.svg') center/cover;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero-title { font-size: 36px; font-weight: 800; color: #0f172a; margin-bottom: 12px; letter-spacing: -1px; line-height: 1.2; }
.hero-subtitle { font-size: 15px; color: var(--text-secondary); max-width: 520px; line-height: 1.7; }
.hero-search { position: absolute; top: 22px; right: 32px; width: 300px; }
.hero-search input {
  width: 100%;
  padding: 10px 16px 10px 38px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #fff;
  box-shadow: var(--shadow-sm);
  font-size: 13px;
  outline: none;
}
.hero-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.hero-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }

/* 功能卡片 */
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.feature-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
  transition: all .2s ease;
  cursor: pointer;
}
.feature-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.feature-icon { width: 42px; height: 42px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #0f172a; flex-shrink: 0; }
.feature-icon svg { width: 20px; height: 20px; }
.feature-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
.feature-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

/* 筛选栏 */
.filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-tab {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s ease;
  border: 1px solid transparent;
  background: transparent;
}
.filter-tab:hover { background: #fff; color: var(--text); }
.filter-tab.active { background: var(--primary); color: #fff; }
.search-box { position: relative; width: 260px; }
.search-box input {
  width: 100%;
  padding: 8px 14px 8px 34px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 13px;
  outline: none;
}
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 14px; height: 14px; }

/* 区块标题 */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; color: #0f172a; }
.section-title svg { width: 18px; height: 18px; color: var(--text-muted); }
.section-more { font-size: 13px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 2px; transition: color .15s; }
.section-more:hover { color: var(--primary); }

/* 卡片网格与卡片 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.card-item {
  background: var(--card-bg);
  border-radius: var(--radius-xl);
  padding: 24px 18px 18px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: all .3s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
  position: relative;
  border: 1px solid transparent;
}
.card-item:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--border-subtle); }
.card-rank {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-rank.top { background: var(--primary); color: #fff; border-color: var(--primary); }
.card-rank.top2 { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.card-rank.top3 { background: #f59e0b; color: #fff; border-color: #f59e0b; }
.card-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  margin: 0 auto 16px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  background: #f1f5f9;
}
.card-title-text { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 42px;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; min-height: 24px; }
.card-footer { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 12px; color: var(--text-muted); }
.card-footer svg { width: 12px; height: 12px; }

/* 基础卡片/表格等 */
.card { background: var(--card-bg); border-radius: var(--radius-xl); border: none; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--text); letter-spacing: -0.2px; }

.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }
.tag-primary { background: var(--primary-light); color: var(--primary-dark); }
.tag-success { background: #d1fae5; color: #047857; }
.tag-warning { background: #fef3c7; color: #b45309; }
.tag-danger { background: #fee2e2; color: #b91c1c; }
.tag-default { background: #f1f5f9; color: var(--text-secondary); }
.tag-light { background: #f1f5f9; color: #475569; }

.btn { padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid transparent; background: var(--primary); color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s ease; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-default { background: #fff; color: var(--text); border-color: var(--border); }
.btn-default:hover { background: var(--bg); border-color: var(--border); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: var(--danger); }
.btn-danger:hover { background: #dc2626; }
.btn-success { background: var(--success); }
.btn-success:hover { background: #059669; }

input, select, textarea { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; outline: none; background: #fff; transition: all .15s ease; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.form-row { display: flex; align-items: center; margin-bottom: 14px; }
.form-row label { width: 100px; color: var(--text-secondary); flex-shrink: 0; font-size: 13px; font-weight: 600; }
.form-row .input { flex: 1; }
.form-row input, .form-row select, .form-row textarea { width: 100%; }
.form-row textarea { min-height: 120px; resize: vertical; }

table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); }
th { background: transparent; color: var(--text-secondary); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
tbody tr:hover td { background: #fafafa; }
tbody tr:last-child td { border-bottom: none; }

.login-box { width: 400px; margin: 140px auto; background: var(--card-bg); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); }
.login-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 28px; letter-spacing: -0.5px; }
.login-box input { width: 100%; margin-bottom: 18px; }
.login-box button { width: 100%; }

/* 聊天 */
.chat-page { display: flex; flex-direction: column; height: calc(100vh - var(--top-nav-height) - 120px); background: var(--card-bg); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow); }
.chat-messages { flex: 2; overflow-y: auto; padding: 24px; }
.chat-input-area { flex: 1; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 20px; background: #fafafa; }
.chat-input-area textarea { flex: 1; width: 100%; resize: none; margin-bottom: 14px; border-radius: var(--radius); }
.chat-message { margin-bottom: 18px; display: flex; }
.chat-message.user { justify-content: flex-end; }
.chat-bubble { max-width: 72%; padding: 14px 18px; border-radius: var(--radius-lg); line-height: 1.65; font-size: 14px; box-shadow: var(--shadow-sm); }
.chat-message.user .chat-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: var(--radius-sm); }
.chat-message.assistant .chat-bubble { background: #f1f5f9; color: var(--text); border-bottom-left-radius: var(--radius-sm); }

/* 知识库详情 */
.kb-detail { display: flex; gap: 20px; height: calc(100vh - var(--top-nav-height) - 120px); position: relative; }
.kb-detail-left { width: 300px; background: var(--card-bg); border-radius: var(--radius-xl); overflow: auto; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.kb-detail-right { flex: 1; background: var(--card-bg); border-radius: var(--radius-xl); overflow: auto; position: relative; box-shadow: var(--shadow); }
.kb-detail-ai { position: absolute; left: 324px; right: 0; bottom: 0; height: 60px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 -8px 24px rgba(15,23,42,0.08); display: flex; padding: 10px 16px; gap: 12px; z-index: 10; transition: all .25s cubic-bezier(0.4,0,0.2,1); }
.kb-detail-ai.expanded { height: calc(100% - 24px); top: 12px; left: 336px; right: 12px; bottom: 12px; flex-direction: column; border-radius: var(--radius); }
.kb-detail-ai input { flex: 1; border-radius: var(--radius-sm); }
.kb-detail-ai .ai-history { display: none; flex: 1; overflow-y: auto; padding: 14px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 12px; }
.kb-detail-ai.expanded .ai-history { display: block; }
.kb-detail-ai .ai-input-row { display: flex; gap: 12px; width: 100%; }
.ai-collapse-btn { position: absolute; top: 8px; right: 12px; display: none; background: transparent; border: none; color: var(--text-secondary); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px; z-index: 11; }
.ai-collapse-btn:hover { color: var(--primary); }
.kb-detail-ai.expanded .ai-collapse-btn { display: block; }

/* 创建/编辑页 */
.builder { display: flex; gap: 16px; height: calc(100vh - var(--top-nav-height) - 100px); }
.builder-left { width: 520px; overflow: auto; padding: 4px 0; }
.builder-left .card { margin-bottom: 14px; padding: 18px; }
.builder-left .card-title { font-size: 14px; margin-bottom: 14px; }
.builder-left .form-row { margin-bottom: 12px; align-items: flex-start; }
.builder-left .form-row label { width: 90px; padding-top: 8px; font-size: 12px; }
.builder-left .form-row input, .builder-left .form-row textarea, .builder-left .form-row select { padding: 8px 12px; font-size: 13px; }

    function seedRandom(seed) {
      let s = 0;
      for (let i = 0; i < seed.length; i++) s = ((s << 5) - s) + seed.charCodeAt(i), s |= 0;
      return function() {
        s = (s * 9301 + 49297) % 233280;
        return s / 233280;
      };
    }

    function randomPick(arr, seed) {
      const rnd = seedRandom(String(seed))();
      return arr[Math.floor(rnd * arr.length)];
    }

    function coverUrl(seed) { return placeholderCover(seed, 400, 300); }

    function stringHash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return Math.abs(h);
    }

    function hueFromSeed(seed) {
      return stringHash(String(seed)) % 360;
    }

      const h = hueFromSeed(seed);
      const h2 = (h + 40) % 360;

      { title: '智慧图书馆推出 AI 文献助手', summary: '图书馆全新上线 AI 文献助手，支持智能检索、文献摘要与研究趋势分析。', intro: '图书馆全新上线的“AI 文献助手”近日面向全校师生开放试用，支持智能检索、文献摘要、研究趋势分析等功能。', body: '师生只需用自然语言描述研究主题，系统即可在海量数据库中快速定位相关文献，并自动生成综述摘要与引用推荐。该助手还整合了学校购买的 100 余个中外文数据库资源，实现一站式学术搜索。', outro: '图书馆计划根据试用反馈持续优化模型，预计秋季学期正式纳入常规服务体系。' },
      { title: '学校举办首届生成式 AI 创新大赛', summary: '首届生成式 AI 创新大赛圆满落幕，300 余支队伍展示 AI 创意应用。', intro: '由教务处、团委联合主办的首届“生成式 AI 创新大赛”圆满落幕，共有来自 18 个学院的 300 余支队伍报名参赛。', body: '参赛作品涵盖 AI 辅助教学设计、智能校园服务、创意内容生成等多个方向。经过初赛、复赛和现场答辩，最终评选出一等奖 5 项、二等奖 10 项、三等奖 20 项，涌现出一批具有落地潜力的项目。', outro: '大赛优秀作品将优先推荐入驻学校 AI 智能体商店，并有机会获得创业孵化支持。' },
      { title: 'AI 心理健康筛查系统上线试运行', summary: '学工部推出基于 AI 的心理健康筛查与干预系统，助力主动预警。', intro: '学工部联合心理中心推出基于 AI 的心理健康筛查与干预系统，助力学生心理健康工作从“被动等待”向“主动预警”转变。', body: '系统通过分析学生在校行为数据与自评量表，建立多维度心理健康画像，对可能存在心理困扰的学生及时发出预警，并推荐相应的心理辅导资源。所有数据均经过脱敏处理，严格保护隐私。', outro: '心理中心负责人表示，AI 系统将作为人工咨询的重要补充，帮助学生更早获得支持。' },
      { title: '教务处推出智能排课与选课推荐引擎', summary: '智能排课与选课推荐引擎上线，利用 AI 算法优化教学资源配置。', intro: '为解决传统排课与选课中的冲突难题，教务处正式上线智能排课与选课推荐引擎，利用 AI 算法优化教学资源配置。', body: '新引擎能够综合考虑教师时间、教室容量、学生培养方案、课程先修关系等因素，自动生成更合理的课表；同时在选课时为学生推荐符合个人兴趣与学业规划的课程组合，减少选课盲目性。', outro: '系统上线后，排课冲突率下降超过 60%，学生选课满意度显著提升。' },
      { title: '我校获批省级人工智能现代产业学院', summary: '我校申报的人工智能现代产业学院成功入选首批省级现代产业学院。', intro: '省教育厅近日公布首批省级现代产业学院建设名单，我校申报的“人工智能现代产业学院”成功入选。', body: '该产业学院由学校联合本地龙头企业共同建设，面向智能制造、智慧教育、数字政务等领域，培养具备工程实践能力的 AI 应用型人才。学院将实行“双导师制”与项目化教学。', outro: '学校将以产业学院建设为契机，进一步深化产教融合，服务区域数字经济高质量发展。' },
      { title: '科研团队发布面向教育的开源大模型', summary: '我校团队发布教育领域开源大模型 EduMind-7B，并同步开源训练数据。', intro: '我校计算机学院科研团队正式发布面向教育领域的开源大模型“EduMind-7B”，并同步开源训练数据与微调代码。', body: '该模型在课程问答、作文批改、知识点解析等教育任务上表现优异，参数规模适中，可在普通服务器上部署运行。团队希望通过开源方式汇聚全球开发者力量，共同推动教育 AI 发展。', outro: '模型已在 Hugging Face 与 GitHub 平台上线，一周内下载量突破 1 万次。' },
      { title: 'AI 导师助力研究生科研选题', summary: '研究生院试点推出 AI 导师服务，帮助研究生快速发现研究空白。', intro: '研究生院试点推出“AI 导师”服务，帮助研究生在海量文献中快速发现研究空白、确定科研选题。', body: 'AI 导师能够根据学生研究方向与兴趣，自动检索相关文献、生成研究热点图谱，并提供选题可行性分析。试点学院反馈，学生选题效率平均提升 40% 以上。', outro: '研究生院计划在下一学年将 AI 导师服务扩展至全体研究生，并接入实验设计与论文写作辅助功能。' },
      { title: '校园安防系统完成 AI 视觉升级', summary: '校园视频监控系统完成 AI 视觉升级，实现异常行为智能识别。', intro: '保卫处近日完成校园视频监控系统的 AI 视觉升级，实现重点区域异常行为智能识别与实时预警。', body: '升级后的系统具备人员聚集检测、异常徘徊识别、消防通道占用监测等功能，并能自动联动安保人员处置。系统采用边缘计算架构，有效降低数据传输压力。', outro: '保卫处强调，AI 安防仅用于公共区域安全管理，严格遵守个人信息保护相关法律法规。' },
      { title: '学校启动“AI+”交叉学科人才培养计划', summary: '学校启动“AI+”交叉学科人才培养计划，鼓励各专业学生掌握 AI 能力。', intro: '为培养面向未来的复合型创新人才，学校正式启动“AI+”交叉学科人才培养计划，鼓励各专业学生掌握人工智能基础能力。', body: '计划将开设“AI 通识课”“Python 与数据分析”“大模型应用实践”等模块化课程，并支持学生跨学院选修 AI 相关专业课程。完成学分要求的学生可获得“AI+”微专业证书。', outro: '学校相关负责人表示，未来所有专业都将融入 AI 元素，让每位学生都能享受人工智能带来的学习便利。' },
      { title: '智能招生问答机器人录取季服务超 10 万人次', summary: '招生办智能问答机器人累计服务考生及家长超过 10 万人次。', intro: '在今年本科招生录取期间，学校招生办部署的智能问答机器人累计服务考生及家长超过 10 万人次，成为招生宣传的重要助手。', body: '机器人基于招生政策、专业介绍、历年分数线等知识库进行训练，能够 7×24 小时回答志愿填报、录取规则、奖助学金等常见问题，准确率达到 92% 以上。', outro: '招生办计划进一步优化机器人多轮对话能力，并在考研、出国留学等咨询服务中推广应用。' },
      { title: 'AI 绘画工作坊成为本学期热门选修课', summary: '艺术学院开设的 AI 绘画工作坊受到学生热捧，选课人数超出计划 3 倍。', intro: '艺术学院开设的“AI 绘画与数字创作”工作坊一经推出便受到学生热捧，选课人数超出计划名额 3 倍。', body: '课程引导学生学习提示词工程、风格迁移、图像生成与后期编辑等技术，并结合设计思维进行创意表达。学生作品已在学校美术馆举办专题展览。', outro: '学院表示，AI 绘画课程将传统艺术教育与前沿技术相结合，激发学生创作潜能。' },
      { title: '我校与头部 AI 企业签署战略合作协议', summary: '学校与多家头部人工智能企业签署协议，在人才培养与科研攻关方面深度合作。', intro: '学校近日与多家头部人工智能企业签署战略合作协议，将在人才培养、科研攻关、成果转化等方面开展深度合作。', body: '根据协议，企业将向学校开放算力资源、真实业务场景与案例库，学校则为企业提供人才输送与联合研发支持。双方还将共建实习实训基地，打造校企协同育人新模式。', outro: '此次合作标志着学校 AI 产学研生态建设进入新阶段，将为师生提供更多实践与就业机会。' },
      { title: '智能实验室助手实现实验数据自动采集', summary: '理工科实验室全面引入智能实验室助手，实现数据自动采集与异常识别。', intro: '我校理工科实验室全面引入“智能实验室助手”，实现实验设备数据自动采集、异常识别与报告生成。', body: '该系统通过物联网传感器与 AI 分析模型，实时监控实验环境温度、湿度、设备运行状态，并在发现异常时及时告警。学生可将更多精力投入实验设计与分析。', outro: '实验室负责人表示，智能助手显著提升了实验效率与安全性，未来将推广至更多学科实验室。' },
      { title: 'AI 同声传译系统助力国际学术会议', summary: '学校首次启用 AI 同声传译系统，为国际学术会议提供实时多语言支持。', intro: '在近日举办的国际人工智能与教育学术会议上，学校首次启用 AI 同声传译系统，为中外学者提供实时 multilingual 交流支持。', body: '该系统支持中英日德法等 8 种语言互译，语音识别准确率达 95% 以上，并可根据学科术语进行自适应优化。会议期间累计提供同传服务超过 60 小时。', outro: '国际处表示，AI 同传系统将广泛应用于学校国际交流与合作活动，提升国际化办学水平。' },
      { title: '学校推出 AI 论文写作与查重辅助平台', summary: '图书馆与研究生院联合推出 AI 论文写作与查重辅助平台。', intro: '为规范学术写作、提升论文质量，学校图书馆与研究生院联合推出 AI 论文写作与查重辅助平台。', body: '平台提供文献综述生成、写作规范检查、语法润色、智能查重等功能，帮助学生从选题到成稿全流程提升写作效率。平台还与学校论文管理系统无缝对接，方便导师在线审阅。', outro: '相关负责人提醒，AI 工具仅作为辅助，学生应坚持学术诚信，确保论文原创性。' },
      { title: '师生共创的校园 AI 智能体商店正式上线', summary: '由师生团队共同开发的校园 AI 智能体商店正式上线，集中展示各类智能体应用。', intro: '由学校信息化建设中心与师生团队共同开发的“校园 AI 智能体商店”正式上线，集中展示师生创作的各类智能体应用。', body: '商店涵盖学习助手、生活服务、科研工具、校园文化等多个分类，用户可一键订阅使用。优秀作品还将获得学校创新创业基金支持，并推荐参加省级以上竞赛。', outro: '学校希望通过智能体商店激发师生创新活力，打造共建共享的校园 AI 应用生态。' },
      { title: '学校推出 AI 辅助课程思政建设平台', summary: '马克思主义学院与信息中心联合推出 AI 课程思政案例库，助力专业课思政元素挖掘。', intro: '为深化课程思政建设，马克思主义学院与信息中心联合推出 AI 辅助课程思政建设平台，面向全校教师开放试用。', body: '平台利用大语言模型和知识图谱技术，能够根据专业课程内容自动推荐思政元素、典型案例和教学设计，帮助教师将价值引领融入专业教学。目前平台已覆盖工学、理学、人文等 8 个学科门类。', outro: '马克思主义学院负责人表示，AI 技术为课程思政提供了新工具，但价值引领仍需教师发挥主体作用。' },
      { title: 'AI 智能阅卷系统首次用于期末考试', summary: '本学期期末部分公共课试点 AI 智能阅卷，客观题即时出分、主观题辅助评分。', intro: '本学期期末，《高等数学》《大学英语》等公共基础课首次试点 AI 智能阅卷系统，实现客观题即时出分、主观题辅助评分。', body: '系统基于深度学习模型对学生作答进行语义分析，能够对简答题、论述题给出评分建议和详细评语。教师可在系统推荐基础上复核调整，阅卷效率提升约 50%。', outro: '教务处表示，AI 阅卷将先在公共课试点，逐步推广到更多课程，最终形成人机协同的评阅模式。' },
      { title: '我校开设全国首个 AI 通识教育必修课', summary: '面向全体本科生的《人工智能通识》必修课正式开课，培养 AI 时代核心素养。', intro: '我校面向全体本科生开设《人工智能通识》必修课，成为全国首批将 AI 通识教育纳入人才培养方案的高校之一。', body: '课程内容涵盖 AI 基本原理、伦理安全、行业应用和实践体验四个模块，强调培养学生的 AI 思维、批判性思维和创新能力。课程采用线上线下混合式教学，配套 AI 助教和虚拟实验环境。', outro: '教务处负责人表示，AI 通识课不是要培养算法工程师，而是要让每位学生具备理解和驾驭 AI 的能力。' },
      { title: '学校发布教育大数据白皮书', summary: '信息中心发布学校教育大数据白皮书，系统呈现教学、科研、管理数据应用成果。', intro: '学校信息中心正式发布《学校教育大数据应用白皮书（2026）》，系统呈现近年来教育大数据在教学、科研、管理等领域的应用成果。', body: '白皮书显示，学校已建成覆盖教学运行、学生学习、科研绩效、后勤服务的统一数据平台，累计沉淀数据资产超过 50TB。基于数据分析，学校在教学资源配置、学业预警、精准资助等方面取得显著成效。', outro: '信息中心表示，下一步将重点推进数据治理和隐私计算，释放数据价值的同时保障师生数据安全。' },
      { title: 'AI 校园导览机器人亮相迎新季', summary: '迎新季期间，AI 校园导览机器人亮相校门口，为新生提供路线指引和报到咨询。', intro: '今年迎新季，学校首次部署 AI 校园导览机器人，为新生和家长提供路线指引、报到咨询、校园介绍等服务。', body: '机器人集成了语音识别、自然语言处理和地图导航技术，能够回答宿舍位置、食堂分布、缴费流程等常见问题，并主动引导新生前往目的地。试运行三天累计服务超过 3000 人次。', outro: '信息中心表示，迎新机器人是智慧校园服务的一次尝试，未来将常驻图书馆、行政楼等场所。' },
      { title: '我校获评全国智慧校园示范校', summary: '学校凭借 AI 服务平台的创新实践，获评全国智慧校园示范校。', intro: '教育部近日公布全国智慧校园示范校名单，我校凭借 AI 服务平台、智慧教学、数据治理等方面的创新实践成功入选。', body: '专家组认为，我校在建设统一 AI 服务入口、推动 AI 与教育教学深度融合、构建人机协同育人模式等方面形成了可复制、可推广的经验。学校将以此为契机，进一步提升智慧校园建设水平。', outro: '校领导表示，获评示范校是新的起点，学校将持续探索 AI 赋能教育的新路径。' },
      { title: 'AI 赋能毕业生就业指导服务升级', summary: '招生就业处推出 AI 就业指导服务，为毕业生提供岗位推荐、简历优化、模拟面试。', intro: '招生就业处推出 AI 赋能毕业生就业指导服务，整合岗位推荐、简历优化、模拟面试、职业测评等功能，为毕业生提供全周期就业支持。', body: '系统能够根据学生专业、兴趣、能力和求职意向，智能推荐匹配岗位，并基于历年招聘数据预测岗位竞争热度。AI 面试官可模拟真实面试场景，帮助学生提前演练并获取改进建议。', outro: '招生就业处负责人表示，AI 就业服务不是要替代就业指导老师，而是让个性化指导覆盖更多学生。' },
      { title: '学校启动 AI 教师数字素养提升计划', summary: '教师发展中心启动专项计划，三年内实现全体教师 AI 数字素养培训全覆盖。', intro: '教师发展中心正式启动“AI 教师数字素养提升计划”，计划在三年内实现全体教师 AI 数字素养培训全覆盖。', body: '计划包括通识培训、学科应用工作坊、教学案例征集、AI 教学创新大赛等内容，旨在帮助教师掌握 AI 工具使用方法，理解 AI 教学伦理，提升智能时代教学设计与评价能力。', outro: '教师发展中心表示，教师是教育数字化转型的关键，提升教师数字素养是推进 AI 教学应用的基础。' },
      { title: 'AI 驱动的个性化学习平台上线', summary: '学校上线 AI 个性化学习平台，为学生推荐学习路径、推送薄弱知识点练习。', intro: '学校正式上线 AI 驱动的个性化学习平台，基于学生学习行为数据和知识掌握情况，为每位学生推荐学习路径和练习资源。', body: '平台能够识别学生的知识薄弱点，智能推送针对性练习和微课视频，并生成个性化学习报告。教师可通过平台掌握班级整体学情，开展精准教学。目前平台已接入数学、英语、计算机等课程。', outro: '教务处表示，个性化学习平台将有效减少学生学习盲目性，提升自主学习效率。' },

    function renderOrgTreeSelect(orgs, selectId, defaultCode) {
      const root = orgs.filter(o => o.level === 1);
      let html = '';
      function walk(nodes, depth) {
        nodes.sort((a, b) => a.code.localeCompare(b.code));
        for (const node of nodes) {
          const indent = '　'.repeat(depth);
          const selected = node.code === defaultCode ? ' selected' : '';
          html += `<option value="${node.code}"${selected}>${indent}${node.name} · ${getOrgLevelName(node.level)}</option>`;
          const children = orgs.filter(o => o.parent_code === node.code);
          if (children.length) walk(children, depth + 1);
        }
      }
      walk(root, 0);
      return `<select id="${selectId}">${html}</select>`;
    }

    function getOrgLevelName(level) {
      return ['校级', '院级', '专业级', '岗位级'][level - 1] || '';
    }

    function renderKbScopeOptions(selectedLevel) {
      return [1, 2, 3, 4].map(lv => `<option value="${lv}"${lv === selectedLevel ? ' selected' : ''}>${getOrgLevelName(lv)}</option>`).join('');
    }

    const KB_SELECTOR_STATE = {};

    function renderKbSelector(kbs, selectedIds, options = {}) {
      const id = options.id || 'kbSelector';
      const selected = new Set(selectedIds || []);
      KB_SELECTOR_STATE[id] = { kbs, selected };
      return `
        <div class="kb-selector" id="${id}">
          <div class="kb-selector-trigger" id="${id}Trigger" onclick="toggleKbSelector('${id}')" tabindex="0">
            <span class="kb-selector-tags" id="${id}Tags"></span>
            <span class="kb-selector-placeholder ${selected.size ? 'hidden' : ''}" id="${id}Placeholder">选择知识库（支持搜索多选）</span>
          </div>
          <div class="kb-selector-dropdown hidden" id="${id}Dropdown">
            <div class="kb-selector-search" onclick="event.stopPropagation()">
              <input type="text" id="${id}Search" placeholder="搜索知识库名称" oninput="filterKbSelector('${id}')">
            </div>
            <div class="kb-selector-list" id="${id}List">
              ${renderKbSelectorOptions(id)}
            </div>
          </div>
          <input type="hidden" id="botKb" value="${Array.from(selected).join(',')}">
        </div>
      `;
    }

    function renderKbSelectorOptions(id) {
      const { kbs, selected } = KB_SELECTOR_STATE[id] || {};
      const query = (document.getElementById(`${id}Search`)?.value || '').trim().toLowerCase();
      const filtered = kbs.filter(k => escapeHtml(k.name).toLowerCase().includes(query));
      if (!filtered.length) return '<div class="kb-selector-empty">未找到匹配的知识库</div>';
      return filtered.map(k => {
        const isSelected = selected.has(k.id);
        return `<div class="kb-selector-option ${isSelected ? 'selected' : ''}" data-id="${k.id}" onclick="toggleKbOption('${id}', ${k.id}); event.stopPropagation()">
          <span class="kb-selector-option-name">${escapeHtml(k.name)}</span>
          <span class="kb-selector-check">${isSelected ? '✓' : ''}</span>
        </div>`;
      }).join('');
    }

    function updateKbSelectorOptions(id) {
      const state = KB_SELECTOR_STATE[id];
      if (!state) return;
      const list = document.getElementById(`${id}List`);
      if (!list) return;
      list.querySelectorAll('.kb-selector-option').forEach(el => {
        const kbId = parseInt(el.dataset.id);
        const isSelected = state.selected.has(kbId);
        el.classList.toggle('selected', isSelected);
        const check = el.querySelector('.kb-selector-check');
        if (check) check.textContent = isSelected ? '✓' : '';
      });
    }

    function renderKbSelectorTags(id) {
      const { kbs, selected } = KB_SELECTOR_STATE[id] || {};
      const tagsEl = document.getElementById(`${id}Tags`);
      const placeholder = document.getElementById(`${id}Placeholder`);
      if (!tagsEl) return;
      const selectedItems = kbs.filter(k => selected.has(k.id));
      tagsEl.innerHTML = selectedItems.map(k => `
        <span class="kb-selector-tag">
          ${escapeHtml(k.name)}
          <span class="remove" onclick="removeKbOption('${id}', ${k.id}); event.stopPropagation()">×</span>
        </span>
      `).join('');
      if (placeholder) placeholder.classList.toggle('hidden', selected.size > 0);
      const input = document.getElementById('botKb');
      if (input) input.value = Array.from(selected).join(',');
    }

    function toggleKbSelector(id) {
      const dd = document.getElementById(`${id}Dropdown`);
      const trigger = document.getElementById(`${id}Trigger`);
      if (!dd) return;
      const isHidden = dd.classList.contains('hidden');
      document.querySelectorAll('.kb-selector-dropdown').forEach(d => d.classList.add('hidden'));
      document.querySelectorAll('.kb-selector-trigger').forEach(t => t.classList.remove('focus'));
      if (isHidden) {
        dd.classList.remove('hidden');
        trigger.classList.add('focus');
        setTimeout(() => document.getElementById(`${id}Search`)?.focus(), 10);
      } else {
        dd.classList.add('hidden');
        trigger.classList.remove('focus');
      }
    }

    function toggleKbOption(id, kbId) {
      const state = KB_SELECTOR_STATE[id];
      if (!state) return;
      if (state.selected.has(kbId)) state.selected.delete(kbId);
      else state.selected.add(kbId);
      renderKbSelectorTags(id);
      updateKbSelectorOptions(id);
    }

    function removeKbOption(id, kbId) {
      const state = KB_SELECTOR_STATE[id];
      if (!state) return;
      state.selected.delete(kbId);
      renderKbSelectorTags(id);
      updateKbSelectorOptions(id);
    }

    function filterKbSelector(id) {
      document.getElementById(`${id}List`).innerHTML = renderKbSelectorOptions(id);
    }

    function regenerateBotAvatar() {
      const seed = Math.random().toString(36).slice(2) + Date.now().toString(36);
      const url = `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(seed)}`;
      const preview = document.getElementById('botAvatarPreview');
      const input = document.getElementById('botAvatar');
      if (preview) preview.src = url;
      if (input) input.value = url;
    }

    function uploadBotAvatar(input) {
      const file = input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件');
        input.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const url = e.target.result;
        const preview = document.getElementById('botAvatarPreview');
        const avatarInput = document.getElementById('botAvatar');
        if (preview) preview.src = url;
        if (avatarInput) avatarInput.value = url;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    });

    async function request(path, opts = {}) {
      const url = `${API}${path}`;
      const headers = { ...(opts.headers || {}) };
      if (token && !headers['Authorization']) headers['Authorization'] = `Bearer ${token}`;
      if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.body);
      }
      try {
        const res = await fetch(url, { ...opts, headers });
        if (res.status === 401) {
          if (route.name !== 'showcase') {
            token = '';
            localStorage.removeItem('token');
            navigate('login');
          }
          throw new Error('未登录');
        }
        if (res.headers.get('content-type')?.includes('application/json')) return res.json();
        return res.text();
      } catch (e) {
        return [];
      }
    }

    function navigate(name, params = {}) {
      route = { name, params };
      const id = params.id !== undefined ? '/' + params.id : '';
      window.location.hash = name === 'login' ? '#/login' : `#/${name}${id}`;
      render();
    }

    function parseRoute() {
      const hash = window.location.hash || '#/agents';
      const parts = hash.replace('#/', '').split('/');
      let name = parts[0] || 'agents';
      if (name === 'plaza') name = 'agents';
      route = { name, params: { id: parts[1] } };
      if (!token && route.name !== 'login' && route.name !== 'showcase') route.name = 'login';
    }

    function updateTopNavTime() {
      const el = document.getElementById('topNavTime');
      if (!el) return;
      const now = new Date();
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      el.textContent = `${y}年${m}月${d}日 ${weekDays[now.getDay()]} ${h}:${min}`;
    }

            <div class="content" id="content" style="${isShowcase ? 'padding:0' : ''}"></div>

    function setBreadcrumb(html) {
      const el = document.getElementById('headerLeft');
      if (el) el.innerHTML = `<div class="breadcrumb">${html}</div>`;
    }

    function escapeHtml(text) {
      if (text == null) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatViews(n) {
      if (n >= 10000) return (n / 10000).toFixed(1) + '万';
      return String(n);
    }

    function setActiveTab(containerId, tab) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.querySelectorAll('.filter-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    }

    function heroBanner({ title, subtitle, bgImage, searchPlaceholder, onSearch, searchId }) {
      return `
        <div class="hero" style="background-image: linear-gradient(105deg, rgba(248,250,252,0.95) 0%, rgba(224,231,255,0.85) 55%, rgba(255,255,255,0.3) 100%), url('${bgImage}')">
          <h1 class="hero-title">${escapeHtml(title)}</h1>
          <p class="hero-subtitle">${escapeHtml(subtitle)}</p>
          <div class="hero-search">
            ${ICONS.search}
            <input type="text" id="${searchId}" placeholder="${escapeHtml(searchPlaceholder)}" onkeydown="if(event.key==='Enter') ${onSearch}(this.value)">
          </div>
        </div>
      `;
    }

    function renderFilterBar({ tabs, activeTab, searchPlaceholder, searchId, onSearch, tabId, onTabClick, actions = '' }) {
      return `
        <div class="filter-bar">
          <div class="filter-tabs" id="${tabId}">
            ${tabs.map(t => `<button class="filter-tab ${t === activeTab ? 'active' : ''}" data-tab="${escapeHtml(t)}" onclick="${onTabClick}('${escapeHtml(t)}')">${escapeHtml(t)}</button>`).join('')}
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="search-box">
              ${ICONS.search}
              <input type="text" id="${searchId}" placeholder="${escapeHtml(searchPlaceholder)}" oninput="${onSearch}(this.value)">
            </div>
            ${actions}
          </div>
        </div>
      `;
    }

    function resourceCard(item, onclick, opts = {}) {
      const tags = item.tags || [];
      const avatar = item.avatar || item.icon || item.cover || avatarUrl(item.id);
      const footer = opts.hideFooter ? '' : `
        <div class="card-footer">
          <span class="card-author">${ICONS.user}${escapeHtml(item.author || '官方')}</span>
          <span class="card-views">${ICONS.eye}${formatViews(item.views || 0)}</span>
        </div>
      `;
      return `
        <div class="card-item" onclick="${onclick}">
          <img class="card-avatar" src="${avatar}" alt="">
          <div class="card-title-text" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
          <div class="card-desc">${escapeHtml(item.description || '')}</div>
          <div class="card-tags">
            ${tags.map(t => `<span class="tag ${t.type || 'tag-default'}">${escapeHtml(t.label)}</span>`).join('')}
          </div>
          ${footer}
        </div>
      `;
    }

    function filterItems(items, tab, query, type) {
      let result = [...items];
      const q = (query || '').trim().toLowerCase();
      if (tab === '热门') {
        result.sort((a, b) => (b.views || 0) - (a.views || 0));
      } else if (tab === '最新') {
        result.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      } else if (tab && tab !== '全部') {
        result = result.filter(i => (i.category || '') === tab);
      }
      if (q) {
        result = result.filter(i =>
          (i.name || '').toLowerCase().includes(q) ||
          (i.description || '').toLowerCase().includes(q) ||
          (i.tags || []).some(t => (t.label || t).toLowerCase().includes(q)) ||
          (i.author || '').toLowerCase().includes(q)
        );
      }
      return result;
    }

    async function renderLogin(el) {
      el.innerHTML = `

          <div style="color:var(--text-secondary);font-size:13px;margin-bottom:12px">演示环境，默认使用 admin 账号登录...</div>
          <input id="loginUser" placeholder="用户名" value="admin">
          <input id="loginPass" type="password" placeholder="密码" value="123456">
          <button class="btn" onclick="doLogin()">登录</button>
        </div>
      `;
      setTimeout(() => doLogin(), 50);
    }

    async function doLogin() {
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;
      try {
        const data = await request('/api/v1/auth/login', { method: 'POST', body: { username, password } });
        token = data.access_token;
        currentUser = data.user;
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(currentUser));
        navigate('agents');
      } catch (e) {
        alert('登录失败：' + e.message);
      }
    }

    function toggleUserDropdown() {
      const dd = document.getElementById('userDropdown');
      const trigger = document.querySelector('.user-trigger');
      if (!dd) return;
      dd.classList.toggle('hidden');
      trigger?.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('userMenu');
      if (!menu || menu.contains(e.target)) return;
      const dd = document.getElementById('userDropdown');
      const trigger = menu.querySelector('.user-trigger');
      if (dd && !dd.classList.contains('hidden')) {
        dd.classList.add('hidden');
        trigger?.classList.remove('open');
      }
    });

    function logout() {
      token = '';
      currentUser = {};
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      navigate('login');
    }

    async function renderEventsPlaza(el) {
      setBreadcrumb('活动与竞赛');
      const res = await request('/api/v1/events');
      const events = Array.isArray(res) ? res : [];
      const state = { tab: '全部', query: '' };

      const categoryMap = { competition: '竞赛', lecture: '讲座', recruitment: '招聘', activity: '活动' };
      const categoryReverse = { '竞赛': 'competition', '讲座': 'lecture', '招聘': 'recruitment', '活动': 'activity' };

      const renderGrid = () => {
        let filtered = [...events];
        const q = (state.query || '').trim().toLowerCase();
        if (state.tab !== '全部') {
          filtered = filtered.filter(e => categoryMap[e.category] === state.tab);
        }
        if (q) {
          filtered = filtered.filter(e =>
            (e.title || '').toLowerCase().includes(q) ||
            (e.summary || '').toLowerCase().includes(q) ||
            (e.organizer || '').toLowerCase().includes(q)
          );
        }
        document.getElementById('eventsGrid').innerHTML = filtered.map(e => {
          const isPlaceholder = !e.cover || e.cover.includes('example.com') || e.cover.includes('placeholder-event');
          const cover = isPlaceholder ? `https://picsum.photos/seed/event${e.id}/400/300` : e.cover;
          const start = e.start_time ? e.start_time.slice(0, 16).replace('T', ' ') : '';
          return `
            <div class="card-item" onclick="navigate('event-detail', {id: ${e.id}})">
              <img class="card-avatar" src="${cover}" alt="" style="width:100%;height:140px;border-radius:12px;object-fit:cover;margin-bottom:12px">
              <div class="card-title-text" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</div>
              <div class="card-desc">${escapeHtml(e.summary || '')}</div>
              <div class="card-tags">
                <span class="tag tag-primary">${categoryMap[e.category] || e.category}</span>
                ${e.location ? `<span class="tag tag-default">${escapeHtml(e.location)}</span>` : ''}
                ${start ? `<span class="tag tag-default">${start}</span>` : ''}
              </div>
              <div class="card-footer">
                <span>${ICONS.user}${escapeHtml(e.organizer || '官方')}</span>
                <span>${e.registration_open ? '报名中' : '已截止'}</span>
              </div>
            </div>
          `;
        }).join('') || '<div class="empty">暂无活动</div>';
      };

      el.innerHTML = `

          <div class="grid" id="eventsGrid"></div>
        </div>
      `;
      window.eventsPlazaSearch = (q) => { state.query = q; renderGrid(); };
      window.eventsPlazaTab = (tab) => { state.tab = tab; setActiveTab('eventsTabs', tab); renderGrid(); };
      document.getElementById('eventsHeroSearch').addEventListener('input', e => { document.getElementById('eventsFilterSearch').value = e.target.value; window.eventsPlazaSearch(e.target.value); });
      renderGrid();

    async function registerEvent(id) {

      if (!btn || btn.disabled) return;
      try {
        await request(`/api/v1/events/${id}/register`, { method: 'POST', body: {} });
        alert('报名成功');
        renderEventDetail(document.getElementById('content'));

        alert('报名失败：' + (e.message || '未知错误'));

    /* ========== 互动组件（点赞/评分/评论） ========== */
    async function renderInteractionPanel(targetType, targetId, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '<div class="empty" style="padding:24px">加载互动数据中...</div>';
      try {
        const stats = await request(`/api/v1/interactions/${targetType}/${targetId}/stats`) || { likes: 0, rating_count: 0, rating_avg: 0, comments: 0, user_liked: false, user_rating: null };
        const comments = await request(`/api/v1/interactions/${targetType}/${targetId}/comments`) || [];
        container.innerHTML = `
          <div style="border-top:1px solid var(--border);padding-top:24px">
            <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap">
              <button class="btn ${stats.user_liked ? '' : 'btn-default'}" onclick="toggleLike('${targetType}', ${targetId}, '${containerId}')">
                ${stats.user_liked ? '♥ 已赞' : '♡ 点赞'} ${stats.likes || 0}
              </button>
              <div style="display:flex;align-items:center;gap:8px">
                <span>评分：</span>
                <div id="ratingStars" style="display:flex;gap:4px;font-size:20px;color:#f59e0b;cursor:pointer">
                  ${[1,2,3,4,5].map(s => `<span onclick="submitRating('${targetType}', ${targetId}, ${s}, '${containerId}')">${s <= (stats.user_rating || Math.round(stats.rating_avg || 0)) ? '★' : '☆'}</span>`).join('')}
                </div>
                <span style="color:var(--text-muted);font-size:13px">${stats.rating_avg || 0} (${stats.rating_count || 0}人评价)</span>
              </div>
            </div>
            <div style="margin-bottom:24px">
              <textarea id="commentInput" placeholder="发表你的评论..." style="width:100%;min-height:80px;margin-bottom:10px"></textarea>
              <button class="btn" onclick="submitComment('${targetType}', ${targetId}, '${containerId}')">发表评论</button>
            </div>
            <div style="font-weight:700;margin-bottom:14px">评论 (${stats.comments || 0})</div>
            <div id="commentsList">
              ${comments.length ? comments.map(c => `
                <div style="padding:14px 0;border-bottom:1px solid var(--border-subtle)">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                    <span style="font-weight:600;font-size:13px">${escapeHtml(c.user_name || '用户')}</span>
                    <span style="color:var(--text-muted);font-size:12px">${c.created_at ? c.created_at.slice(0,16).replace('T',' ') : ''}</span>
                  </div>
                  <div style="color:var(--text);line-height:1.6">${escapeHtml(c.content)}</div>
                </div>
              `).join('') : '<div class="empty" style="padding:16px 0">暂无评论，快来抢沙发吧~</div>'}
            </div>
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div class="empty" style="padding:24px">互动数据加载失败</div>`;
      }
    }

    async function toggleLike(targetType, targetId, containerId) {
      await request(`/api/v1/interactions/${targetType}/${targetId}/like`, { method: 'POST' });
      renderInteractionPanel(targetType, targetId, containerId);
    }

    async function submitRating(targetType, targetId, score, containerId) {
      await request(`/api/v1/interactions/${targetType}/${targetId}/rating`, { method: 'POST', body: { score } });
      renderInteractionPanel(targetType, targetId, containerId);
    }

    async function submitComment(targetType, targetId, containerId) {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;
      await request(`/api/v1/interactions/${targetType}/${targetId}/comments`, { method: 'POST', body: { content } });
      renderInteractionPanel(targetType, targetId, containerId);
    }

    async function doUploadInBuilder(input) {
      const file = input.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('file', file);
      form.append('folder_path', '/');

      input.value = '';
      renderKbBuilder(document.getElementById('content'));

    async function saveKb(kbId) {
      const body = {
        name: document.getElementById('kbName').value,
        description: document.getElementById('kbDesc').value,
        org_code: document.getElementById('kbOrg').value,
      };
      if (kbId) {
        alert('知识库编辑接口待补充，当前仅可上传文档');
        return;
      }
      const res = await request('/api/v1/kb', { method: 'POST', body });
      navigate('kb-builder', { id: res.id });

    async function deleteKb(kbId) {
      if (!confirm('确定要删除该知识库吗？库内所有文档将一并删除且不可恢复。')) return;
      const res = await request(`/api/v1/kb/${kbId}`, { method: 'DELETE' });
      if (res && res.ok) {
        alert('已删除');
        navigate('my-kbs');
      } else {
        alert('删除失败：' + (res && res.detail ? res.detail : '未知错误'));
      }
    }

    /* ========== 文档列表与预览（复用） ========== */
    function renderDocList(docs) {
      const el = document.getElementById('docList');
      const kb = window.kbDetail || {};
      const canDeleteDoc = (d) => {
        const uid = Number(currentUser.id);
        return currentUser.role === 'admin' || Number(d.created_by) === uid || Number(kb.owner_id) === uid;
      };
      el.innerHTML = docs.map(d => `
        <div class="doc-item" data-id="${d.id}" data-type="${d.file_type || ''}" onclick="selectDoc(${d.id})">
          <span class="doc-item-name">${d.file_type === 'online' ? '<span class="online-doc-tag">在线文档</span>' : ''}${escapeHtml(d.name)}</span>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span class="tag ${d.status === 'ready' ? 'tag-success' : 'tag-danger'}">${d.status}</span>
            ${canDeleteDoc(d) ? `<button class="btn btn-sm btn-danger" onclick="deleteDoc(event, ${d.id})">删除</button>` : ''}
          </div>
        </div>
      `).join('') || '<div class="empty">暂无文档</div>';
    }

    async function selectDoc(docId) {
      document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
      const item = document.querySelector(`.doc-item[data-id="${docId}"]`);
      if (item) item.classList.add('active');
      const fileType = (item?.dataset.type || '').toLowerCase();
      const panel = document.getElementById('previewPanel');
      if (fileType === 'online') {
        if (route.name === 'kb-builder') {
          await openOnlineDocEditor(docId);
        } else {
          const html = await request(`/api/v1/documents/${docId}/preview`);
          panel.innerHTML = `<div class="preview-box">${html}</div>`;
        }
        return;
      }
      if (fileType === 'pdf') {
        const res = await fetch(`${API}/api/v1/documents/${docId}/download`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) { panel.innerHTML = '<div class="preview-box">PDF 加载失败</div>'; return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        panel.innerHTML = `<div class="preview-box" style="height:100%;"><embed src="${url}" type="application/pdf" width="100%" height="100%"></embed></div>`;
        return;
      }
      const html = await request(`/api/v1/documents/${docId}/preview`);
      panel.innerHTML = `<div class="preview-box">${html}</div>`;
    }

    async function deleteDoc(event, docId) {
      event.stopPropagation();
      if (!confirm('确定要删除该文档吗？')) return;
      await request(`/api/v1/documents/${docId}`, { method: 'DELETE' });
      if (route.name === 'kb-builder') {
        renderKbBuilder(document.getElementById('content'));
      } else {
        renderKbDetail(document.getElementById('content'));
      }
    }

    async function openOnlineDocEditor(docId = 0) {
      const isNew = docId === 0;
      if (!isNew) {
        document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
        const item = document.querySelector(`.doc-item[data-id="${docId}"]`);
        if (item) item.classList.add('active');
      }
      let name = '';
      let content = '';
      if (!isNew) {
        try {
          const data = await request(`/api/v1/documents/${docId}/content`);
          name = data.name || '';
          content = data.content || '';
        } catch (e) {
          name = '';
          content = '';
        }
      }
      const panel = document.getElementById('previewPanel');
      panel.innerHTML = `
        <div class="online-editor">
          <div class="online-editor-header">
            <input id="onlineDocName" value="${escapeHtml(name)}" placeholder="请输入在线文档标题">
            <button class="btn btn-sm" onclick="saveOnlineDoc(${docId})">${isNew ? '保存' : '保存修改'}</button>
          </div>
          <div class="online-editor-toolbar">
            <button type="button" onclick="formatDoc('bold')" title="加粗"><b>B</b></button>
            <button type="button" onclick="formatDoc('italic')" title="斜体"><i>I</i></button>
            <button type="button" onclick="formatDoc('underline')" title="下划线"><u>U</u></button>
            <button type="button" onclick="formatDoc('insertUnorderedList')" title="无序列表">• 列表</button>
            <button type="button" onclick="formatDoc('insertOrderedList')" title="有序列表">1. 列表</button>
            <button type="button" onclick="formatDoc('formatBlock', 'H1')" title="标题1">H1</button>
            <button type="button" onclick="formatDoc('formatBlock', 'H2')" title="标题2">H2</button>
            <button type="button" onclick="formatDoc('formatBlock', 'P')" title="正文">P</button>
          </div>
          <div id="onlineDocEditor" class="online-editor-body" contenteditable="true">${content}</div>
        </div>
      `;
    }

    function formatDoc(command, value = null) {
      document.execCommand(command, false, value);
      document.getElementById('onlineDocEditor')?.focus();
    }

    async function saveOnlineDoc(docId) {
      const name = document.getElementById('onlineDocName').value.trim();
      const content = document.getElementById('onlineDocEditor').innerHTML;
      if (!name) {
        alert('请输入文档标题');
        return;
      }
      const kbId = window.kbDetail?.id;
      if (!kbId) {
        alert('请先保存知识库');
        return;
      }
      try {
        let res;
        if (!docId) {
          res = await request(`/api/v1/kb/${kbId}/online-documents`, {
            method: 'POST',
            body: { name, content, folder_path: '/' }
          });
          alert('在线文档已创建');
          await renderKbBuilder(document.getElementById('content'));
          if (res && res.id) {
            await openOnlineDocEditor(res.id);
          }
        } else {
          res = await request(`/api/v1/documents/${docId}/content`, {
            method: 'PUT',
            body: { name, content }
          });
          alert('在线文档已保存');
          await renderKbBuilder(document.getElementById('content'));
          await openOnlineDocEditor(docId);
        }
      } catch (e) {
        alert('保存失败：' + (e.message || '未知错误'));
      }
    }

    async function streamChat(url, body, msgs) {
      const res = await fetch(`${API}${url}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(body)
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let text = '';
      let sources = [];
      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'chat-bubble';
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message assistant';
      msgDiv.appendChild(bubbleDiv);
      msgs.appendChild(msgDiv);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const data = line.replace('data:', '').trim();
          if (!data) continue;
          try {
            const evt = JSON.parse(data);
            if (evt.type === 'thinking') {
              bubbleDiv.innerHTML = `<span class="typing">${escapeHtml(evt.content)}</span>`;
              msgs.scrollTop = msgs.scrollHeight;
            } else if (evt.type === 'answer' || evt.type === 'token') {
              text += evt.content || evt.data || '';
              bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');
              msgs.scrollTop = msgs.scrollHeight;
            } else if (evt.type === 'source') {
              const raw = evt.content || evt.data;
              sources = typeof raw === 'string' ? JSON.parse(raw) : raw;
            }
          } catch (e) {}
        }
      }
      if (sources.length) {
        bubbleDiv.innerHTML += renderSources(sources);
      }
      msgs.scrollTop = msgs.scrollHeight;
    }

    function initNewsEditor(n) {
      const content = document.getElementById('newsEditorContent');
      const title = document.getElementById('newsEditorTitle');
      const summaryTop = document.getElementById('newsEditorSummaryTop');
      const summarySide = document.getElementById('newsEditorSummary');
      const author = document.getElementById('newsEditorAuthor');
      const date = document.getElementById('newsEditorDate');
      const coverPreview = document.getElementById('newsCoverPreview');

      const updatePreview = () => {
        document.getElementById('phoneTitle').textContent = title.value || '标题';
        document.getElementById('phoneMeta').textContent = (author.value || '官方') + ' · ' + (date.value || new Date().toISOString().slice(0,10));
        document.getElementById('phoneBody').innerHTML = content.innerHTML;
        if (summaryTop.value !== summarySide.value) summarySide.value = summaryTop.value;
      };

      content.addEventListener('input', updatePreview);
      content.addEventListener('click', newsEditorUpdateToolbar);
      content.addEventListener('keyup', newsEditorUpdateToolbar);
      content.addEventListener('mouseup', newsEditorUpdateToolbar);
      title.addEventListener('input', updatePreview);
      author.addEventListener('input', updatePreview);
      date.addEventListener('input', updatePreview);
      summaryTop.addEventListener('input', updatePreview);
      summarySide.addEventListener('input', () => { summaryTop.value = summarySide.value; updatePreview(); });

      window.newsEditorCurrentCover = n.cover || '';
      window.newsEditorCurrentWideCover = n.wide_cover || n.cover || '';

      content.focus();
      const range = document.createRange();
      range.selectNodeContents(content);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function newsEditorUpdateToolbar() {
      document.querySelectorAll('#newsEditorToolbar .tool-btn[data-cmd]').forEach(btn => {
        const cmd = btn.dataset.cmd;
        try {
          btn.classList.toggle('active', document.queryCommandState(cmd));
        } catch (e) {}
      });
    }

    function newsEditorExec(cmd, value) {
      document.getElementById('newsEditorContent').focus();
      document.execCommand(cmd, false, value || null);
      newsEditorUpdateToolbar();
      newsEditorUpdatePreview();
    }

    function newsEditorSetBlock(tag) {
      if (!tag) return;
      const editor = document.getElementById('newsEditorContent');
      editor.focus();
      if (tag === 'BLOCKQUOTE') {
        document.execCommand('formatBlock', false, 'blockquote');
      } else {
        document.execCommand('formatBlock', false, tag);
      }
      newsEditorUpdatePreview();
    }

    function newsEditorInsertLink() {
      const url = prompt('请输入链接地址：', 'https://');
      if (!url) return;
      newsEditorExec('createLink', url);
    }

    function newsEditorInsertImage() {
      const url = prompt('请输入图片地址：', 'https://');
      if (!url) return;
      newsEditorExec('insertImage', url);
    }

    function newsEditorUploadImage(input) {
      const file = input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('请选择图片'); input.value = ''; return; }
      const reader = new FileReader();
      reader.onload = (e) => newsEditorExec('insertImage', e.target.result);
      reader.readAsDataURL(file);
      input.value = '';
    }

    function newsEditorInsertVideo() {
      const url = prompt('请输入视频 iframe 地址或视频直链：', 'https://');
      if (!url) return;
      const editor = document.getElementById('newsEditorContent');
      editor.focus();
      let html = '';
      if (url.includes('iframe')) {
        html = `<div style="margin:1em 0">${url}</div>`;
      } else if (url.includes('bilibili.com') || url.includes('youtube.com') || url.includes('youku.com')) {
        html = `<p style="color:#999">请直接粘贴 embed/iframe 代码</p>`;
      } else {
        html = `<video src="${url}" controls style="max-width:100%;border-radius:8px;margin:1em 0"></video>`;
      }
      document.execCommand('insertHTML', false, html);
      newsEditorUpdatePreview();
    }

    function newsEditorInsertDivider() {
      newsEditorExec('insertHorizontalRule');
    }

    function newsEditorUpdatePreview() {
      const content = document.getElementById('newsEditorContent');
      const phoneBody = document.getElementById('phoneBody');
      if (content && phoneBody) phoneBody.innerHTML = content.innerHTML;
    }

    function newsEditorPickCover() {
      document.getElementById('newsCoverUpload').click();
    }

    function newsEditorUploadCover(input) {
      const file = input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('请选择图片'); input.value = ''; return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        window.newsEditorCurrentCover = e.target.result;
        window.newsEditorCurrentWideCover = e.target.result;
        const preview = document.getElementById('newsCoverPreview');
        preview.innerHTML = `<img src="${e.target.result}" alt=""><div class="cover-mask">点击更换封面</div>`;
        const phoneCover = document.getElementById('phoneCover');
        phoneCover.src = e.target.result;
        phoneCover.style.display = 'block';
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function closeNewsEditor() {
      const overlay = document.getElementById('newsEditorOverlay');
      if (overlay) overlay.remove();
    }

    function newsEditorSave(id) {
      const title = document.getElementById('newsEditorTitle').value.trim();
      let summary = document.getElementById('newsEditorSummaryTop').value.trim();
      const content = document.getElementById('newsEditorContent').innerHTML;
      const category = document.getElementById('newsEditorCategory').value;
      const author = document.getElementById('newsEditorAuthor').value.trim();
      const created_at = document.getElementById('newsEditorDate').value || new Date().toISOString().slice(0, 10);
      const cover = window.newsEditorCurrentCover || '';
      const wide_cover = window.newsEditorCurrentWideCover || cover;
      if (!title) { alert('请输入标题'); return; }
      const plainText = content.replace(/\u003c[^\u003e]+\u003e/g, '').replace(/\s+/g, '').trim();
      if (!plainText) { alert('请输入正文'); return; }
      if (!summary) {
        const text = content.replace(/\u003c[^\u003e]+\u003e/g, '').replace(/\s+/g, ' ').trim();
        summary = text.slice(0, 120) + (text.length > 120 ? '...' : '');
      }

      if (id) {
        const n = mockNews.find(x => x.id === id);
        Object.assign(n, { title, summary, content, cover, wide_cover, category, author, created_at });
      } else {
        const newId = mockNews.length ? Math.max(...mockNews.map(x => x.id)) + 1 : 1;
        mockNews.unshift({ id: newId, title, summary, content, cover, wide_cover, category, author, views: 0, created_at });
      }
      localStorage.setItem('mockNewsV3', JSON.stringify(mockNews));
      closeAdminModal();
      renderAdminNews(document.getElementById('content'));
    }

    function deleteNews(id) {
      if (!confirm('确定删除？')) return;
      mockNews = mockNews.filter(x => x.id !== id);
      localStorage.setItem('mockNewsV3', JSON.stringify(mockNews));
      renderAdminNews(document.getElementById('content'));
    }

        role: document.getElementById('userRole').value,
        org_code: document.getElementById('userOrg').value,
        scope_code: document.getElementById('userScope').value,
      };
      await request('/api/v1/admin/users', { method: 'POST', body });
      closeAdminModal();
      renderAdminUsers(document.getElementById('content'));
    }

    async function deleteUser(id) {
      if (!confirm('确定删除该用户？')) return;
      await request(`/api/v1/admin/users/${id}`, { method: 'DELETE' });
      renderAdminUsers(document.getElementById('content'));
    }

    /* ========== 管理后台：系统配置 ========== */
    async function renderAdminConfig(el) {
      const configs = await request('/api/v1/config') || [];
      setBreadcrumb('管理后台 / 系统配置');
      const configMap = {};
      configs.forEach(c => configMap[c.key] = c);

      const announcement = configMap.site_announcement?.value || { enabled: false, content: '' };
      const regSwitch = configMap.registration_switch?.value || { enabled: true };
      const llm = configMap.llm_settings?.value || { default_model: 'deepseek-chat', available_models: [], temperature: 0.7, max_tokens: 2048, top_p: 1.0 };
      const rec = configMap.recommendation_slots?.value || { home_banners: [], featured_kbs: [], featured_bots: [] };

      el.innerHTML = `
        <div class="page-title flex flex-between">
          <span>系统配置</span>
          <button class="btn" onclick="saveAdminConfig()">保存配置</button>
        </div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title">站点公告</div>
          <div class="form-row">
            <label>启用公告</label>
            <div class="input"><input type="checkbox" id="cfgAnnouncementEnabled" ${announcement.enabled ? 'checked' : ''}></div>
          </div>
          <div class="form-row">
            <label>公告内容</label>
            <div class="input"><textarea id="cfgAnnouncementContent">${escapeHtml(announcement.content || '')}</textarea></div>
          </div>
        </div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title">注册开关</div>
          <div class="form-row">
            <label>允许注册</label>
            <div class="input"><input type="checkbox" id="cfgRegEnabled" ${regSwitch.enabled ? 'checked' : ''}></div>
          </div>
        </div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title">模型参数</div>
          <div class="form-row">
            <label>默认模型</label>
            <div class="input"><input id="cfgDefaultModel" value="${escapeHtml(llm.default_model)}"></div>
          </div>
          <div class="form-row">
            <label>可用模型</label>
            <div class="input"><input id="cfgAvailableModels" value="${escapeHtml((llm.available_models || []).join(','))}" placeholder="逗号分隔"></div>
          </div>
          <div class="form-row">
            <label>Temperature</label>
            <div class="input"><input id="cfgTemperature" type="number" step="0.1" value="${llm.temperature}" min="0" max="2"></div>
          </div>
          <div class="form-row">
            <label>Max Tokens</label>
            <div class="input"><input id="cfgMaxTokens" type="number" value="${llm.max_tokens}"></div>
          </div>
          <div class="form-row">
            <label>Top P</label>
            <div class="input"><input id="cfgTopP" type="number" step="0.1" value="${llm.top_p}" min="0" max="1"></div>
          </div>
        </div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title">推荐位（JSON）</div>
          <div class="form-row">
            <label>配置</label>
            <div class="input"><textarea id="cfgRecommendation" style="min-height:120px;font-family:monospace">${escapeHtml(JSON.stringify(rec, null, 2))}</textarea></div>
          </div>
        </div>
      `;
    }

    async function saveAdminConfig() {
      try {
        const recommendation = JSON.parse(document.getElementById('cfgRecommendation').value);
        const items = [
          { key: 'site_announcement', value: { enabled: document.getElementById('cfgAnnouncementEnabled').checked, content: document.getElementById('cfgAnnouncementContent').value } },
          { key: 'registration_switch', value: { enabled: document.getElementById('cfgRegEnabled').checked } },
          { key: 'llm_settings', value: {
            default_model: document.getElementById('cfgDefaultModel').value,
            available_models: document.getElementById('cfgAvailableModels').value.split(',').map(s => s.trim()).filter(Boolean),
            temperature: parseFloat(document.getElementById('cfgTemperature').value),
            max_tokens: parseInt(document.getElementById('cfgMaxTokens').value),
            top_p: parseFloat(document.getElementById('cfgTopP').value)
          }},
          { key: 'recommendation_slots', value: recommendation }
        ];
        await request('/api/v1/config', { method: 'PUT', body: items });
        alert('配置已保存');
      } catch (e) {
        alert('保存失败：' + (e.message || '未知错误'));
      }
    }

    /* ========== 启动 ========== */
    window.addEventListener('hashchange', () => { parseRoute(); render(); });
    setInterval(() => { if (route.name !== 'login') updateTopNavTime(); }, 60000);
    parseRoute();
    if (token || route.name === 'showcase') render();
    else navigate('login');
  </script>
  <script src="/static/yi-know-assistant.js" defer></script>
</body>
</html>
